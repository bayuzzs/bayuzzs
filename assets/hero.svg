<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bayu Maulana — Product Engineer</title>
  <desc id="desc">A dark editorial banner reading Ideas to Products to Impact.</desc>

  <defs>
    <linearGradient id="background" x1="34" y1="10" x2="1167" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.48" stop-color="#080D1D"/>
      <stop offset="1" stop-color="#100B25"/>
    </linearGradient>
    <linearGradient id="accent" x1="102" y1="99" x2="1092" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(985 38) rotate(133.5) scale(315 342)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(82 404) rotate(-25.9) scale(369 247)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#93C5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#cyanGlow)"/>
    <rect width="1200" height="420" fill="url(#violetGlow)"/>

    <circle cx="1084" cy="88" r="110" stroke="#22D3EE" stroke-opacity="0.11"/>
    <circle cx="1084" cy="88" r="148" stroke="#A78BFA" stroke-opacity="0.08"/>
    <circle cx="1084" cy="88" r="4" fill="#22D3EE"/>

    <path d="M960 334C1005 277 1070 251 1208 272" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.48"/>
    <path d="M995 361C1044 316 1100 299 1208 310" stroke="#A78BFA" stroke-opacity="0.2"/>

    <g filter="url(#blur)" opacity="0.85">
      <circle cx="962" cy="335" r="18" fill="#22D3EE"/>
      <circle cx="1130" cy="309" r="13" fill="#A78BFA"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g transform="translate(72 58)">
        <rect width="171" height="34" rx="17" fill="#0B1C30" stroke="#22D3EE" stroke-opacity="0.38"/>
        <circle cx="20" cy="17" r="4" fill="#34D399"/>
        <text x="34" y="22" fill="#A5F3FC" font-size="13" font-weight="600" letter-spacing="1.7">BASED IN INDONESIA</text>
      </g>

      <text x="72" y="162" fill="#8B949E" font-size="17" font-weight="600" letter-spacing="4.6">PRODUCT ENGINEER</text>
      <text x="68" y="239" fill="#F8FAFC" font-size="69" font-weight="750" letter-spacing="-2.4">Bayu Maulana</text>

      <text x="72" y="301" fill="#CBD5E1" font-size="24" font-weight="500">Ideas</text>
      <path d="M140 294H190" stroke="#334155" stroke-width="2"/>
      <path d="M184 288L191 294L184 300" stroke="#58A6FF" stroke-width="2"/>
      <text x="209" y="301" fill="#E2E8F0" font-size="24" font-weight="600">Products</text>
      <path d="M315 294H365" stroke="#334155" stroke-width="2"/>
      <path d="M359 288L366 294L359 300" stroke="#A78BFA" stroke-width="2"/>
      <text x="384" y="301" fill="url(#accent)" font-size="24" font-weight="700">Impact</text>

      <text x="72" y="356" fill="#64748B" font-size="16" letter-spacing="0.6">Software · operations · connected products</text>

      <g transform="translate(958 156)">
        <rect width="174" height="82" rx="14" fill="#0A1222" stroke="#94A3B8" stroke-opacity="0.16"/>
        <circle cx="20" cy="20" r="4" fill="#FB7185"/>
        <circle cx="34" cy="20" r="4" fill="#FBBF24"/>
        <circle cx="48" cy="20" r="4" fill="#34D399"/>
        <text x="20" y="53" fill="#64748B" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ ship --useful</text>
        <rect x="20" y="65" width="80" height="2" rx="1" fill="url(#accent)"/>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" stroke="url(#accent)" stroke-opacity="0.26" stroke-width="1.5"/>
</svg>
